 <script>

 /* =====================================================
    基本設定
 ===================================================== */

 const video =
     document.getElementById("video");

 const canvas =
     document.getElementById("canvas");

 const ctx =
     canvas.getContext("2d");

 const status =
     document.getElementById("status");

 const startBtn =
     document.getElementById("startBtn");

 const stopBtn =
     document.getElementById("stopBtn");

 const testBtn =
     document.getElementById("testBtn");


 let camera = null;

 let frameNumber = 0;
 let frameBusy = false;
 let lastFaceTime = 0;
 let lastHandTime = 0;

 let running = false;


 /* =====================================================
    前回発声した時間
 ===================================================== */

 let lastSpoken = {

     mouth: 0,

     eye: 0,

     smile: 0,

     fist: 0,

     openHand: 0,

     test: 0

 };


 /* =====================================================
    表情を開始した時間
 ===================================================== */

 let holdStart = {

     mouth: 0,

     eye: 0,

     smile: 0

 };


 /* =====================================================
    距離計算
 ===================================================== */

 function distance(a, b) {

     const dx = a.x - b.x;

     const dy = a.y - b.y;

     const dz = (a.z || 0) - (b.z || 0);

     return Math.sqrt(
         dx * dx +
         dy * dy +
         dz * dz
     );

 }


 /* =====================================================
    目のランドマーク

    左目
 ===================================================== */

 const LEFT_EYE = [

     33,
     160,
     158,
     133,
     153,
     144

 ];


 /* =====================================================
    右目
 ===================================================== */

 const RIGHT_EYE = [

     362,
     385,
     387,
     263,
     373,
     380

 ];


 /* =====================================================
    目の開き具合

    上下の距離
    ÷
    左右の距離
 ===================================================== */

 function eyeAspect(landmarks, ids) {

     const vertical1 =
         distance(
             landmarks[ids[1]],
             landmarks[ids[5]]
         );

     const vertical2 =
         distance(
             landmarks[ids[2]],
             landmarks[ids[4]]
         );

     const vertical =
         (vertical1 + vertical2) / 2;

     const horizontal =
         distance(
             landmarks[ids[0]],
             landmarks[ids[3]]
         );

     if(horizontal === 0) {
         return 0;
     }

     return vertical / horizontal;

 }


 /* =====================================================
    口の開き

    13 = 上唇付近
    14 = 下唇付近

    61 = 左口角
    291 = 右口角
 ===================================================== */

 function getMouthOpen(landmarks) {

     const vertical =
         distance(
             landmarks[13],
             landmarks[14]
         );

     const horizontal =
         distance(
             landmarks[61],
             landmarks[291]
         );

     if(horizontal === 0) {
         return 0;
     }

     return vertical / horizontal;

 }


 /* =====================================================
    笑顔指標

    口の横幅
    ÷
    鼻から口までの距離

    ※感情認識ではなく、
      顔の形状変化を利用した簡易判定
 ===================================================== */

 function getSmileScore(landmarks) {

     const mouthWidth =
         distance(
             landmarks[61],
             landmarks[291]
         );


     const mouthCenter = {

         x:
             (
                 landmarks[13].x +
                 landmarks[14].x
             ) / 2,

         y:
             (
                 landmarks[13].y +
                 landmarks[14].y
             ) / 2,

         z:
             (
                 (landmarks[13].z || 0) +
                 (landmarks[14].z || 0)
             ) / 2

     };


     const verticalDistance =
         distance(
             landmarks[1],
             mouthCenter
         );


     if(verticalDistance === 0) {
         return 0;
     }

     return mouthWidth / verticalDistance;

 }


 /* =====================================================
    音声
 ===================================================== */

 function speak(text, type) {

     text = text.trim();

     if(!text) {
         return;
     }


     const now =
         performance.now();


     const cooldown =
         Number(
             document.getElementById(
                 "cooldown"
             ).value
         );


     if(
         now - lastSpoken[type]
         <
         cooldown
     ) {

         return;

     }


     lastSpoken[type] = now;


     speechSynthesis.cancel();


     const utterance =
         new SpeechSynthesisUtterance(
             text
         );


     utterance.lang = "ja-JP";


     utterance.rate =
         Number(
             document.getElementById(
                 "rate"
             ).value
         );


     utterance.pitch =
         Number(
             document.getElementById(
                 "pitch"
             ).value
         );


     utterance.volume =
         Number(
             document.getElementById(
                 "volume"
             ).value
         );


     /* 選択した声 */

     const selectedVoice =
         document.getElementById(
             "voiceSelect"
         ).value;


     const voices =
         speechSynthesis.getVoices();


     const voice =
         voices.find(
             v =>
                 v.voiceURI ===
                 selectedVoice
         );


     if(voice) {

         utterance.voice = voice;

     }


     speechSynthesis.speak(
         utterance
     );


     addLog(
         "" +
         type +
         " → 「" +
         text +
         "」"
     );

 }


 /* =====================================================
    ログ
 ===================================================== */

 function addLog(text) {

     const log =
         document.getElementById(
             "log"
         );


     const time =
         new Date()
         .toLocaleTimeString();


     log.textContent =
         "[" +
         time +
         "] " +
         text +
         "\n" +
         log.textContent;

 }


 /* =====================================================
    表情判定
 ===================================================== */

 function processTrigger(
     type,
     active,
     text
 ) {

     const now =
         performance.now();


     const holdTime =
         Number(
             document.getElementById(
                 "holdTime"
             ).value
         );


     if(active) {

         if(
             holdStart[type] === 0
         ) {

             holdStart[type] =
                 now;

         }


         if(
             now -
             holdStart[type]
             >=
             holdTime
         ) {

             speak(
                 text,
                 type
             );


             /*
              * 表情を維持している間は
              * 何度も発声しない
              */

             holdStart[type] =
                 now + 1000000;

         }

     } else {

         holdStart[type] = 0;

     }

 }


 /* =====================================================
    MediaPipe Face Mesh
 ===================================================== */

 
let latestHandLandmarks = [];
let previousHandState = "none";
let handHoldStart = {
  fist: 0,
  open: 0
};

const hands = new Hands({
  locateFile: function(file) {
    return "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file;
  }
});

hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 0,
  minDetectionConfidence: 0.45,
  minTrackingConfidence: 0.45
});

function angle3(a, b, c) {
  const ab = {x:a.x-b.x, y:a.y-b.y, z:(a.z||0)-(b.z||0)};
  const cb = {x:c.x-b.x, y:c.y-b.y, z:(c.z||0)-(b.z||0)};
  const dot = ab.x*cb.x + ab.y*cb.y + ab.z*cb.z;
  const mag1 = Math.hypot(ab.x, ab.y, ab.z);
  const mag2 = Math.hypot(cb.x, cb.y, cb.z);
  if (!mag1 || !mag2) return 0;
  const cos = Math.max(-1, Math.min(1, dot/(mag1*mag2)));
  return Math.acos(cos) * 180 / Math.PI;
}

function fingerExtensionScore(lm, mcp, pip, dip, tip) {
  const wrist = lm[0];
  const mcpDist = distance(lm[mcp], wrist);
  const tipDist = distance(lm[tip], wrist);
  const angle = angle3(lm[mcp], lm[pip], lm[dip]) + angle3(lm[pip], lm[dip], lm[tip]);

  // 距離と関節の伸びを連続値で評価（0〜1）
  const distanceScore = Math.max(0, Math.min(1, (tipDist / Math.max(mcpDist, 0.0001) - 1.05) / 0.75));
  const angleScore = Math.max(0, Math.min(1, (angle - 250) / 100));
  return distanceScore * 0.45 + angleScore * 0.55;
}

function thumbExtensionScore(lm) {
  const wrist = lm[0];
  const tipDist = distance(lm[4], wrist);
  const mcpDist = distance(lm[2], wrist);
  const angle = angle3(lm[2], lm[3], lm[4]);
  const distanceScore = Math.max(0, Math.min(1, (tipDist / Math.max(mcpDist, 0.0001) - 1.0) / 0.8));
  const angleScore = Math.max(0, Math.min(1, (angle - 135) / 45));
  return distanceScore * 0.45 + angleScore * 0.55;
}

function getHandOpenScore(lm) {
  // 0.00〜1.00の連続値で手の開き具合を判定
  // 0.00＝強く握った状態、1.00＝大きく開いた状態
  const scores = [
    thumbExtensionScore(lm),
    fingerExtensionScore(lm, 5, 6, 7, 8),
    fingerExtensionScore(lm, 9, 10, 11, 12),
    fingerExtensionScore(lm, 13, 14, 15, 16),
    fingerExtensionScore(lm, 17, 18, 19, 20)
  ];

  // 手全体の平均。1本の指だけの誤検出で値が大きく変わりにくい。
  return scores.reduce((sum, value) => sum + value, 0) / scores.length;
}

function resetHandTrigger() {
  handHoldStart.fist = 0;
  handHoldStart.open = 0;
  previousHandState = "none";
}

function processHandTrigger(type, active, text) {
  const now = performance.now();
  const holdTime = Number(document.getElementById("holdTime").value);

  if (!active) {
    handHoldStart[type] = 0;
    return;
  }

  if (handHoldStart[type] === 0) {
    handHoldStart[type] = now;
  }

  if (now - handHoldStart[type] >= holdTime) {
    speak(text, type === "fist" ? "fist" : "openHand");
    handHoldStart[type] = now + 1000000;
  }
}

hands.onResults(function(results) {
  latestHandLandmarks = results.multiHandLandmarks || [];

  const metric = document.getElementById("handMetric");
  const value = document.getElementById("handValue");

  if (metric) metric.textContent = String(latestHandLandmarks.length);

  if (!latestHandLandmarks.length) {
    if (value) value.textContent = "0.00";
    resetHandTrigger();
    return;
  }

  // 複数の手がある場合は、最も「開き」が明確な手を使用
  let bestScore = 0;
  for (const lm of latestHandLandmarks) {
    bestScore = Math.max(bestScore, getHandOpenScore(lm));
  }

  if (value) value.textContent = bestScore.toFixed(3);

  const fistThreshold = Number(
    document.getElementById("fistThreshold").value
  );
  const openHandThreshold = Number(
    document.getElementById("openHandThreshold").value
  );

  // 握り判定値は「1 - 開き具合」
  const fistScore = 1 - bestScore;

  const fistActive = fistScore >= fistThreshold;
  const openActive = bestScore >= openHandThreshold;

  // 両方の条件が成立しないよう、しきい値の高い方を優先
  if (fistActive && !openActive) {
    processHandTrigger(
      "fist",
      true,
      document.getElementById("fistText").value
    );
    handHoldStart.open = 0;
  } else if (openActive && !fistActive) {
    processHandTrigger(
      "open",
      true,
      document.getElementById("openHandText").value
    );
    handHoldStart.fist = 0;
  } else {
    handHoldStart.fist = 0;
    handHoldStart.open = 0;
  }
});

];

function drawHands() {
  const connections = (typeof HAND_CONNECTIONS !== "undefined")
    ? HAND_CONNECTIONS
    : HAND_CONNECTIONS_FALLBACK;

  for (const landmarks of latestHandLandmarks) {
    drawConnectors(
      ctx,
      landmarks,
      connections,
      { color: "#00BFFF", lineWidth: 3 }
    );
    drawLandmarks(
      ctx,
      landmarks,
      { color: "#FFFF00", lineWidth: 1, radius: 3 }
    );
  }
}

async function loadCameraDevices() {
  const select = document.getElementById("cameraSelect");
  if (!select || !navigator.mediaDevices?.enumerateDevices) return;

  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    cameraDevices = devices.filter(d => d.kind === "videoinput");

    select.innerHTML = "";

    if (!cameraDevices.length) {
      const option = document.createElement("option");
      option.textContent = "Webカメラが見つかりません";
      select.appendChild(option);
      return;
    }

    cameraDevices.forEach((device, index) => {
      const option = document.createElement("option");
      option.value = device.deviceId;
      option.textContent = device.label || ("Webカメラ " + (index + 1));
      select.appendChild(option);
    });
  } catch (e) {
    console.error(e);
  }
}

 startBtn.addEventListener(

                 true;

                 false;

                 "カメラを開始しました"
             );


             /*
              * MediaPipe Camera
              */

             camera =
                 new Camera(

                     video,

                     {

                         onFrame: async function() {
                             // 顔と手を同時に実行しない（iPad Safari対策）
                             if (!running || video.readyState < 2 || frameBusy) return;

                             const now = performance.now();

                             // 顔を約10fpsで処理
                             if (now - lastFaceTime >= 100) {
                                 frameBusy = true;
                                 lastFaceTime = now;
                                 try {
                                     await faceMesh.send({ image: video });
                                 } catch (error) {
                                     console.error("Face Mesh error:", error);
                                     status.textContent = "顔認識の読み込みに失敗しました";
                                     addLog("Face Mesh ERROR: " + (error.message || error));
                                 } finally {
                                     frameBusy = false;
                                 }
                                 return;
                             }

                             // 手を約6fpsで処理。顔処理とは重ならない。
                             if (now - lastHandTime >= 170) {
                                 frameBusy = true;
                                 lastHandTime = now;
                                 try {
                                     await hands.send({ image: video });
                                 } catch (error) {
                                     console.error("Hands error:", error);
                                     addLog("Hands ERROR: " + (error.message || error));
                                 } finally {

                                 }
                             }

                         height: 480

                     }

                 );

         }
